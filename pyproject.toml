[project]
name = "pulse"
version = "0.1.0"
description = "Pulse — Multimodal Biosignal Stress Assessment & Gamification Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "neurokit2>=0.2.7",
    "pandas>=2.0.0",
    "pyserial>=3.5",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
]

[tool.uv]
package = false
